name: Android Build Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدهای پروژه
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۲. تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ۳. نصب گرادل نسخه 8.13 (همان نسخه سیستم شما)
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # ۴. اصلاح آدرس سرور Maven به سرور گوگل با گرامر دقیق Groovy و Kotlin
      - name: Route Maven Central to Google Mirror
        run: |
          # اصلاح فایل‌های Groovy (.gradle)
          find . -type f -name "*.gradle" -exec sed -i "s|mavenCentral()|maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }|g" {} +
          # اصلاح فایل‌های Kotlin (.gradle.kts)
          find . -type f -name "*.gradle.kts" -exec sed -i 's|mavenCentral()|maven("https://maven-central.storage-download.googleapis.com/maven2/")|g' {} +

      # ۵. ساخت فایل اجرایی گرادل در صورت عدم وجود
      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      # ۶. اجرای بیلد
      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace

      # ۷. آپلود فایل نهایی APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NajiOne-Debug-APK
          path: app/build/outputs/apk/debug/*.apk