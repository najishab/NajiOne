name: Android Build Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Clean Windows sdk.dir from local.properties
        run: |
          if [ -f "local.properties" ]; then
            sed -i '/^sdk\.dir=/d' local.properties
          fi

      - name: Route Maven Central to Google Mirror
        run: |
          find . -type f -name "*.gradle" -exec sed -i "s|mavenCentral()|maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }|g" {} +
          find . -type f -name "*.gradle.kts" -exec sed -i 's|mavenCentral()|maven("https://maven-central.storage-download.googleapis.com/maven2/")|g' {} +

      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NajiOne-Debug-APK
          path: app/build/outputs/apk/debug/*.apk