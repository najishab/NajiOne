name: Android Build Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Clean Windows sdk.dir from local.properties
        run: |
          if [ -f "local.properties" ]; then
            sed -i '/^sdk\.dir=/d' local.properties
          fi

      - name: Route Maven Central to Google Mirror
        run: |
          find . -type f -name "*.gradle" -exec sed -i "s|mavenCentral()|maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }; mavenCentral()|g" {} +
          find . -type f -name "*.gradle.kts" -exec sed -i 's|mavenCentral()|maven("https://maven-central.storage-download.googleapis.com/maven2/"); mavenCentral()|g' {} +

      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      # بیلد یک فایل تکی v8 (اگر نسخه 200 مگی جامع خواستید -PnajiQuick را حذف کنید و پایین *universal*.apk بگذارید)
      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug -PnajiQuick --scan --stacktrace

      # انتشار مستقیم فایل APK بدون Zip در صفحه Releases گیت‌هاب
      - name: Publish Direct APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug app/build/outputs/apk/debug/*.apk \
            --title "Latest Debug APK (#${{ github.run_number }})" \
            --notes "Direct APK download (no ZIP)" \
            --prerelease